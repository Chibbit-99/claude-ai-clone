services:
  - type: web
    name: claude-ai-clone
    runtime: static
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /edge-api/bootstrap/00000000-0000-4000-8000-000000000002/app_start
        destination: /edge-api/app-start.json
      - type: rewrite
        source: /api/bootstrap/00000000-0000-4000-8000-000000000002/current_user_access
        destination: /edge-api/current-user-access.json
      - type: rewrite
        source: /onboarding
        destination: /index.html
      - type: rewrite
        source: /edge-api/bootstrap
        destination: /edge-api/bootstrap.json
      - type: rewrite
        source: /edge-api/client-health/check
        destination: /edge-api/client-health/check.json
      - type: rewrite
        source: /v1/privacy-consents
        destination: /v1/privacy-consents.json
      - type: rewrite
        source: /new
        destination: /index.html
      - type: rewrite
        source: /api/claude_code/organizations/00000000-0000-4000-8000-000000000002/user_settings
        destination: /api/fixtures/claude-code-user-settings.json
      - type: rewrite
        source: /api/organizations/00000000-0000-4000-8000-000000000002/chat_conversations_v2
        destination: /api/fixtures/chat-conversations.json
      - type: rewrite
        source: /api/account_profile
        destination: /api/fixtures/account-profile.json
      - type: rewrite
        source: /api/organizations/discoverable
        destination: /api/fixtures/discoverable-organizations.json
      - type: rewrite
        source: /api/organizations/00000000-0000-4000-8000-000000000002/activation/chorus_free/tasks
        destination: /api/fixtures/activation-tasks.json
