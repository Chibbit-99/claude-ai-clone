<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page not found</title>
    <script>
      if (window.top === window && window.location.pathname !== "/") {
        window.location.replace("/");
      }
    </script>
  </head>
  <body>
    <p>Page not found. <a href="/">Return to the home page</a>.</p>
  </body>
</html>
